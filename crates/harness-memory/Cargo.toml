[package]
name = "harness-memory"
description = "Client for the memory service. Speaks HTTP, not internals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
harness-agent = { path = "../harness-agent" }
# hyper's connection API, without the pooled client and without a TLS stack: a memory call is one
# request under a deadline, and transport security belongs in the sidecar, not in this process.
hyper = { version = "1.11", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["net", "io-util"] }

[dev-dependencies]
tempfile.workspace = true
