[package]
name = "harness-dispatch"
description = "Normalise, route, guard and deliver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Content-addressed route and bundle ids. `default-features = false` for the same reason the other
# crates in this workspace set it: the digest is all that is wanted, not the std feature stack.
sha2 = { version = "0.11", default-features = false }
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
harness-agent = { path = "../harness-agent" }
harness-envelope = { path = "../harness-envelope" }
harness-memory = { path = "../harness-memory" }
harness-screen = { path = "../harness-screen" }

[dev-dependencies]
# A stub store on a real socket, for the tests that exercise the concrete memory client.
tokio = { workspace = true, features = ["net", "io-util"] }
