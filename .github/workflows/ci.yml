name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  hygiene:
    name: hygiene (domain-neutrality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No domain-specific or employer-specific terms
        run: bash ci/hygiene.sh

  test:
    name: fmt · clippy · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy, llvm-tools-preview" }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Advisory while the crate bodies are still todo!(): unimplemented lines cannot be covered,
      # so a blocking gate here would only teach people to ignore a red build. The concrete code
      # (types, constructors, wire round-trips) is genuinely tested and the number is reported on
      # every run. Flip this to blocking — delete continue-on-error — with the first crate whose
      # todo!()s are gone; AGENTS.md tracks it.
      - name: Coverage (advisory until the first crate is implemented)
        continue-on-error: true
        run: cargo llvm-cov --workspace --fail-under-lines 85 --summary-only
